name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Format
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

      - name: Lint
        uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.32.0
          args: --quiet .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install tree-sitter CLI
        run: npm install --global tree-sitter-cli

      - name: Install plugin dependencies
        run: |
          deps="$HOME/.local/share/nvim/site/pack/deps/start"
          mkdir -p "$deps"
          for repo in nvim-treesitter/nvim-treesitter echasnovski/mini.nvim nvim-lua/plenary.nvim; do
            git clone --depth 1 "https://github.com/$repo" "$deps/${repo#*/}"
          done

      - name: Install converters
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Install parsers
        run: nvim --headless --noplugin -u tests/minimal_init.lua -c 'qa!'

      - name: Test
        run: just test
